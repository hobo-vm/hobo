# The kept Linux VM the guest tests clone (HOBO_LINUX_VM, ubuntu26 by default): `make test-vms`
# builds it. Ubuntu with the desktop steps `hobo init --os linux` writes.

cpus   = 4
memory = "4GB"
disk   = "32GB"

[source]
# Ubuntu 26.04 LTS (Resolute Raccoon), release 20261016
image  = "https://cloud-images.ubuntu.com/server/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img"
sha256 = "8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24"

# The desktop, for `hobo view` and GUI testing (`hobo exec --gui`, `hobo screenshot`): Ubuntu's
# minimal desktop, hobo logged in at boot, no screen blanking or lock, and accessibility on
# for AT-SPI. It starts from the next boot.
[[provision]]
type   = "shell"
inline = '''
set -eu
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y -o DPkg::Lock::Timeout=300 ubuntu-desktop-minimal python3-gi gir1.2-atspi-2.0
echo uinput > /etc/modules-load.d/hobo.conf
echo 'KERNEL=="uinput", SUBSYSTEM=="misc", OWNER="hobo", MODE="0600"' > /etc/udev/rules.d/70-hobo-uinput.rules
/usr/local/libexec/hobo-agent gnome-extension
cat > /etc/gdm3/custom.conf <<'EOF'
[daemon]
AutomaticLoginEnable=true
AutomaticLogin=hobo
EOF
mkdir -p /etc/dconf/profile /etc/dconf/db/local.d
printf 'user-db:user\nsystem-db:local\n' > /etc/dconf/profile/user
cat > /etc/dconf/db/local.d/00-hobo <<'EOF'
[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/screensaver]
lock-enabled=false

[org/gnome/desktop/interface]
toolkit-accessibility=true

[org/gnome/shell]
enabled-extensions=['hobo@gsquared.app']
disable-user-extensions=false
EOF
# Locked: hobo's own settings end up holding false (seen on 26.04), which would otherwise win.
mkdir -p /etc/dconf/db/local.d/locks
printf '%s\n' /org/gnome/desktop/interface/toolkit-accessibility /org/gnome/shell/enabled-extensions /org/gnome/shell/disable-user-extensions > /etc/dconf/db/local.d/locks/00-hobo
dconf update
systemctl --global mask gnome-initial-setup-first-login.service gnome-initial-setup-upgrade-login.service
'''
