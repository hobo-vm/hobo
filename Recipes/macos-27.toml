# Base macOS 27 guest. `hobo box build` applies the Vagrant conventions itself (vagrant/vagrant,
# auto-login, Remote Login, passwordless sudo, insecure keys, no sleep or automatic updates), so
# this recipe only pins the source. Derived recipes add `[[provision]]` steps.
name = "greg/macos-27"
version = "1.0.0"
description = "macOS 27.2 (26B123) base with Vagrant conventions"
cpus = 4
memory = "8GB"
disk = "80GB"

